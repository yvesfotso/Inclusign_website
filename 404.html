<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Inclusign</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#EAF5FF" />
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=2026-10-09a" />
  <script>
    // Same theme and language as the rest of the site
    (function () {
      var root = document.documentElement, theme, lang;
      try { theme = localStorage.getItem('inclusign-theme'); lang = localStorage.getItem('inclusign-lang'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if (lang !== 'en' && lang !== 'fr') lang = ((navigator.languages || [navigator.language || 'en'])[0] || 'en').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
      root.setAttribute('data-theme', theme);
      root.setAttribute('lang', lang);
    })();
  </script>
  <style>
    .nf { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 40px var(--gutter); text-align: center; }
    .nf-inner { display: grid; justify-items: center; gap: 18px; max-width: 34rem; }
    .nf-code { font-family: var(--font-display); font-weight: 750; letter-spacing: -0.05em; line-height: .9; font-size: clamp(96px, 26vw, 180px); color: var(--wordmark); }
    .nf .lead { margin: 0 auto; }
    .nf .btn { margin-top: 10px; }
    [lang="fr"] .en, [lang="en"] .fr { display: none; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-inner">
      <a class="brand brand-lg" href="/" aria-label="Inclusign — home">
        <span class="logo" aria-hidden="true">
          <img class="logo-mark on-light" src="/assets/logo-mark.png" alt="" width="46" height="46" />
          <img class="logo-mark on-dark" src="/assets/logo-mark-dark.png" alt="" width="46" height="46" />
          <img class="logo-word on-light" src="/assets/logo-wordmark.png" alt="" width="116" height="25" />
          <img class="logo-word on-dark" src="/assets/logo-wordmark-dark.png" alt="" width="116" height="25" />
        </span>
      </a>
      <p class="nf-code" aria-hidden="true">404</p>
      <h1 class="h2"><span class="en">This page doesn’t exist.</span><span class="fr">Cette page n’existe pas.</span></h1>
      <p class="lead">
        <span class="en">The link may be broken, or the page may have moved. Let’s get you back on track.</span>
        <span class="fr">Le lien est peut-être erroné, ou la page a été déplacée. Revenons sur le bon chemin.</span>
      </p>
      <a class="btn btn-primary" href="/">
        <span class="en">Back to home</span><span class="fr">Retour à l’accueil</span>
        <svg class="arr" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </main>
</body>
</html>
